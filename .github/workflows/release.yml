name: release

# Builds standalone binaries for Windows / Linux / macOS. Runs on a version tag
# (publishes them to the GitHub Release) or on demand via the Actions tab
# (artifacts only).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, asset: windows-x64, ext: ".exe" }
          - { os: ubuntu-latest, asset: linux-x64, ext: "" }
          - { os: macos-latest, asset: macos-arm64, ext: "" }
          - { os: macos-13, asset: macos-x64, ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone feedBack core (stdlib-only song parser, bundled into the binary)
        shell: bash
        run: git clone --depth 1 https://github.com/got-feedback/feedback.git "$RUNNER_TEMP/feedback-core"

      - name: Install build deps
        shell: bash
        run: python -m pip install --upgrade pip pyinstaller pyyaml

      - name: Build
        shell: bash
        env:
          SLOPSMITH_DIR: ${{ runner.temp }}/feedback-core
        run: python -m PyInstaller packaging/psarc2feedpak.spec --noconfirm

      - name: Stage renamed binaries
        shell: bash
        run: |
          mkdir -p out
          cp "dist/psarc2feedpak${{ matrix.ext }}" "out/psarc2feedpak-${{ matrix.asset }}${{ matrix.ext }}"
          cp "dist/psarc2feedpak-gui${{ matrix.ext }}" "out/psarc2feedpak-gui-${{ matrix.asset }}${{ matrix.ext }}"

      - name: Show artifacts
        shell: bash
        run: ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: psarc2feedpak-${{ matrix.asset }}
          path: out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - shell: bash
        run: ls -la dist/

      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
