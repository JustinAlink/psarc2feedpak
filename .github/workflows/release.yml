name: release

# Builds the Windows .exe binaries. Runs on a version tag (attaches them to the
# GitHub Release) or on demand via the Actions tab (artifacts only).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone feedBack core (stdlib-only song parser, bundled into the exe)
        shell: bash
        run: git clone --depth 1 https://github.com/got-feedback/feedback.git "$RUNNER_TEMP/feedback-core"

      - name: Install build deps
        shell: bash
        run: python -m pip install --upgrade pip pyinstaller pyyaml

      - name: Build exes
        shell: bash
        env:
          SLOPSMITH_DIR: ${{ runner.temp }}/feedback-core
        run: python -m PyInstaller packaging/psarc2feedpak.spec --noconfirm

      - name: Show artifacts
        shell: bash
        run: ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: psarc2feedpak-windows
          path: dist/*.exe

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
